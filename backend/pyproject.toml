[project]
name = "marketintel-backend"
version = "0.1.0"
description = "AI Stock Market Intelligence & Portfolio Management Platform - backend API, workers and ML"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=14.0",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "pyotp>=2.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "anthropic>=0.75",
    "feedparser>=6.0.11",
    "python-multipart>=0.0.17",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "fakeredis>=2.26",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "S101",   # assert in tests
    "B008",   # FastAPI Depends in defaults
    "S311",   # random for simulation only (never security)
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]
